name: validate

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARTEX_PG_DSN: postgres://artex:ci-only-password@127.0.0.1:5432/artex_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify PostgreSQL is reachable
        run: psql "$ARTEX_PG_DSN" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Test with PostgreSQL (no cached results)
        shell: bash
        run: |
          set -o pipefail
          go test -p 1 -count=1 -timeout 15m -json ./... | tee test-results.jsonl
      - name: Reject silently skipped database tests
        if: always()
        run: python3 scripts/ci/check-db-tests.py test-results.jsonl
      - name: Build frontend from clean dependencies
        working-directory: web
        run: |
          npm ci
          npm run build:static
      - name: Build current and pre-change binaries
        run: |
          mkdir -p server/webui/dist ci-bin
          cp -a web/out/. server/webui/dist/
          CGO_ENABLED=0 go build -tags embedui -o ci-bin/artex-current ./cmd/artex
          git worktree add --detach "$RUNNER_TEMP/artex-baseline" 90ade93d76d8fcd2eaef6aec3ac1286eb4f43307
          mkdir -p "$RUNNER_TEMP/artex-baseline/server/webui/dist"
          cp -a web/out/. "$RUNNER_TEMP/artex-baseline/server/webui/dist/"
          (cd "$RUNNER_TEMP/artex-baseline" && CGO_ENABLED=0 go build -tags embedui -o "$GITHUB_WORKSPACE/ci-bin/artex-baseline" ./cmd/artex)
      - name: Fresh install and baseline-to-current data preservation
        run: |
          psql "$ARTEX_PG_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE artex_fresh' -c 'CREATE DATABASE artex_upgrade'
          python3 scripts/ci/install-upgrade-smoke.py ci-bin/artex-baseline ci-bin/artex-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: |
            test-results.jsonl
            ci-smoke-logs/

  clean-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build image without layer cache (no push)
        run: >-
          docker build --no-cache
          --build-arg GOPROXY=https://proxy.golang.org,direct
          --build-arg NPM_REGISTRY=https://registry.npmjs.org
          -t artex:validation .
      - name: Binary starts inside image
        run: docker run --rm --entrypoint /app/artex artex:validation -h
      - name: Check release and deployment image agree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          release = Path('.github/workflows/release.yml').read_text()
          compose = Path('docker-compose.yml').read_text()
          assert 'images: mianhuatang11/artex' in release
          assert 'image: mianhuatang11/artex:' in compose
          PY
